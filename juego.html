(function(){

'<g transform="translate(430 340)"><path d="M-4 0 V-34 H62 V0 Z" fill="#8db8c0"/><path d="M42 -34 H62 V0 H42 Z" fill="#6e98a2"/><path d="M-12 -34 L29 -62 L70 -34 Z" fill="#a8503c"/><path d="M-12 -34 L29 -62 L33 -59 L-8 -34 Z" fill="#c86a4c"/><rect x="8" y="-22" width="12" height="22" fill="#3c2f2a"/><rect x="30" y="-26" width="9" height="9" fill="#2f3f48"/></g>';

var gr='<path d="M0 410 H800" stroke="#8a4a30" stroke-width="3" stroke-dasharray="56 18 14 12"/><path d="M0 432 H800" stroke="#8a4a30" stroke-width="3" stroke-dasharray="40 24 16 20"/>';
[[40,392,10],[130,402,6],[210,419,8],[320,396,5],[400,425,9],[520,405,6],[610,392,8],[700,421,6],[760,399,5]].forEach(function(p){gr+='<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="'+p[2]+'" ry="'+p[2]*0.45+'" fill="'+(p[0]%2?"#d9b48c":"#7a432e")+'" opacity=".8"/>';});

function crest(x,r){
  const u=x/(r.level*.98);
  return r.level+r.amplitude*(.72*Math.sin(u)+.30*Math.cos(u*2.09+.8)+.14*Math.sin(u*4.37));
}
function ridgeSection(start,r){
  let edge='',details='';
  for(let x=start;x<=start+800;x+=8){
    const y=crest(x,r);
    edge+=(x===start?'M':' L')+(x-start)+' '+y.toFixed(2);
    if(x>start&&x<start+800&&x%80===0&&crest(x-8,r)>y&&r.speed>.06){
      const local=x-start;
      details+='<path d="M'+local+' '+(y+1)+' q-7 14 -18 20 q12 -4 19 -12 l-5 18 q12 -15 15 -20 Z" fill="'+r.light+'" opacity=".72"/>';

    for(let i=0;i<5;i++){

      details+=palm(x-start,y,.19+.06*(1+Math.sin(x)), '#4f7254','#655b43');
    }
  }
  // Broad, tapered folds follow the hillside. Cluster smaller marks below them.
  for(let j=0;j<12;j++){
    const u=25+j*63, x=start+u, y=crest(x,r)+4, k=Math.sin(x*.017);
    const depth=15+(r.speed*115)*(1+.35*k);
    details+='<path d="M'+u+' '+y+' q-3 9 -13 17 q-8 9 -12 '+depth+' q11 -14 18 -17 q8 -8 10 -16 Z" fill="#244e50" opacity="'+(r.speed*.6+.04)+'"/>';
    if(r.speed>=.19){
      let leaves='';
      for(let n=0;n<12;n++){const px=u+(n%4)*5,py=y+depth+5+Math.floor(n/4)*4+Math.sin(x+n)*3;leaves+='M'+px+' '+py+' q2 -4 5 -1';}
      details+='<path d="'+leaves+'" stroke="#315c48" opacity=".38" stroke-width="1.3" fill="none"/>';
